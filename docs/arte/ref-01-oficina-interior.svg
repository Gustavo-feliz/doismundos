<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a94c9"/>
      <stop offset="60%" stop-color="#f5dec0"/>
      <stop offset="100%" stop-color="#f7cba1"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#fff0d8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Teto industrial escuro -->
  <rect x="0" y="0" width="800" height="90" fill="#2c3034"/>
  <!-- Paredes: reboco quente em cima (#d6cab4) e barra verde-oficina (#2b5852) -->
  <rect x="0" y="90" width="800" height="150" fill="#d6cab4"/>
  <rect x="0" y="232" width="800" height="8" fill="#f2c230"/>
  <rect x="0" y="240" width="800" height="80" fill="#2b5852"/>
  <!-- Piso de concreto manchado (#7a766f) -->
  <rect x="0" y="320" width="800" height="130" fill="#7a766f"/>
  <ellipse cx="410" cy="390" rx="180" ry="32" fill="#1c1814" fill-opacity="0.45"/>
  <!-- Vão do portão ao fundo com luz dourada do Rio -->
  <rect x="520" y="110" width="210" height="210" fill="url(#sky)"/>
  <rect x="520" y="110" width="210" height="45" fill="#6d7275"/>
  <polygon points="520,155 730,155 790,440 430,440" fill="url(#sunbeam)"/>
  <!-- Elevador 2 colunas azul (#24518a) -->
  <rect x="190" y="115" width="26" height="235" fill="#24518a"/>
  <rect x="430" y="115" width="26" height="235" fill="#24518a"/>
  <rect x="190" y="115" width="266" height="16" fill="#24518a"/>
  <!-- Bancada de madeira (#8d6238) e armário vermelho (#b3261e) -->
  <rect x="36" y="265" width="120" height="65" fill="#b3261e"/>
  <rect x="36" y="255" width="120" height="12" fill="#8d6238"/>
  <!-- Legenda -->
  <rect x="20" y="20" width="380" height="52" rx="6" fill="#14171a" fill-opacity="0.88" stroke="#f2c230" stroke-width="2"/>
  <text x="36" y="44" fill="#f2c230" font-family="sans-serif" font-size="15" font-weight="bold">REF 01 — INTERIOR DA OFICINA (DIREÇÃO HÍBRIDA A+B)</text>
  <text x="36" y="62" fill="#e5e7eb" font-family="sans-serif" font-size="12">Reboco #d6cab4 · Barra #2b5852 · Destaque #f2c230 · Elevador #24518a</text>
</svg>

