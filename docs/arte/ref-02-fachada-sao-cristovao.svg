<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="rioSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b76ad"/>
      <stop offset="55%" stop-color="#e8c39e"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <!-- Céu de fim de tarde e silhueta dos morros -->
  <rect x="0" y="0" width="800" height="280" fill="url(#rioSky)"/>
  <polygon points="0,280 140,150 310,280" fill="#526b65"/>
  <polygon points="460,280 650,130 800,240 800,280" fill="#465e58"/>
  <!-- Sobrados de São Cristóvão -->
  <rect x="40" y="130" width="190" height="190" fill="#e9c46a"/>
  <rect x="240" y="110" width="220" height="210" fill="#e76f51"/>
  <rect x="470" y="145" width="280" height="175" fill="#a8dadc"/>
  <!-- Letreiro Oficina do Seu Zé -->
  <rect x="260" y="135" width="180" height="38" fill="#eee8d8" stroke="#1d3c6a" stroke-width="3"/>
  <text x="350" y="160" text-anchor="middle" fill="#172330" font-family="sans-serif" font-size="14" font-weight="bold">OFICINA DO SEU ZÉ</text>
  <!-- Calçada de pedra portuguesa (#bfb8a8 / #232528) e asfalto (#33363a) -->
  <rect x="0" y="320" width="800" height="48" fill="#bfb8a8"/>
  <rect x="0" y="368" width="800" height="82" fill="#33363a"/>
  <rect x="60" y="405" width="90" height="8" fill="#f2c230"/>
  <rect x="240" y="405" width="90" height="8" fill="#f2c230"/>
  <rect x="420" y="405" width="90" height="8" fill="#f2c230"/>
  <rect x="600" y="405" width="90" height="8" fill="#f2c230"/>
  <!-- Legenda -->
  <rect x="20" y="20" width="420" height="52" rx="6" fill="#14171a" fill-opacity="0.88" stroke="#f2c230" stroke-width="2"/>
  <text x="36" y="44" fill="#f2c230" font-family="sans-serif" font-size="15" font-weight="bold">REF 02 — SÃO CRISTÓVÃO (RUA DAS OFICINAS)</text>
  <text x="36" y="62" fill="#e5e7eb" font-family="sans-serif" font-size="12">Sobrados #e9c46a / #e76f51 · Pedra Portuguesa #bfb8a8 · Asfalto #33363a</text>
</svg>

